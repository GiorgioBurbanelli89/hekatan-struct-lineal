    <noscript>
      <h1>Hekatan Struct — Análisis estructural por elementos finitos</h1>
      <p>Plataforma web de análisis estructural que corre enteramente en el
      navegador: solver de elementos finitos en C++/Eigen compilado a WebAssembly,
      visualización 3D con Three.js e interfaz reactiva. Sin instalación y sin
      servidor.</p>
      <h2>Qué permite calcular</h2>
      <ul>
        <li>Pórticos y armaduras en 2D y 3D</li>
        <li>Elementos shell: losas, muros y cascarones</li>
        <li>Cimentaciones y vigas sobre fundación elástica</li>
        <li>Desplazamientos, reacciones y diagramas de fuerzas internas</li>
      </ul>
      <p>Resultados validados contra ETABS, SAP2000 y SAFE, con más de 120 ejemplos
      paramétricos de verificación. Desarrollado por Jorge Burbano, ingeniero
      estructural, Manabí, Ecuador. Licencia MIT.</p>
      <p><strong>Esta herramienta requiere JavaScript activado.</strong></p>
    </noscript>
