[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hekatan-struct-py"
version = "0.1.0"
description = "Hekatan Struct — Python engine: Winkler springs, rigid diaphragm, edificios paramétricos, zapatas, validación ETABS"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "GiorgioBurbanelli89", email = "jbjazzjuventus1989@gmail.com" },
]
keywords = ["fem", "structural", "engineering", "hekatan", "etabs", "ecuador"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.20",
  "scipy>=1.7",
]

[project.optional-dependencies]
viewer = ["pyvista>=0.42", "matplotlib>=3.5"]
sliders = ["ipywidgets>=8.0", "trame>=3.0", "trame-vuetify>=2.0", "trame-vtk>=2.0", "pyvistaqt>=0.11", "PyQt5>=5.15"]
dev = ["pytest>=7", "pytest-cov>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/hekatan_struct"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
markers = [
  "slow: marks tests as slow",
  "validation: cross-validation vs ETABS/SAP2000/OpenSees",
]
