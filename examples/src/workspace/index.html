<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- CRITICAL: prevenir cache de index.html. Sin esto el browser cachea esta
         página con hashes de chunks viejos → 404 cuando deployamos nueva versión. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="/img/favicon.ico" type="image/x-icon" />
    <title>Hekatan Struct Lineal</title>
    <style>
      /* Safe area for mobile browsers with URL bar / notch */
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      body {
        padding-top: var(--safe-top);
        padding-bottom: var(--safe-bottom);
      }
    </style>
    <!-- (Quitado el Google Analytics del proyecto del que sale el fork:
         mandaba datos de uso a una cuenta que no es nuestra. 18-sep-2026) -->
    <!-- GoatCounter analytics removido (cuenta no configurada → 400 errors en consola).
         Para reactivar: registrate en https://www.goatcounter.com/signup, creá tu
         subdominio, y restaurá el <script data-goatcounter=...> con la URL real. -->
    <!-- web-ifc WASM — el archivo vive en `examples/public/` (vite lo copia al
         ROOT del bundle, NO a workspace/). Por eso necesitamos `../`:
           dev:        /workspace/             → ../web-ifc-api-iife.js → /web-ifc-api-iife.js
           gh-pages:   /hekatan-struct-lineal/workspace/ → ../web-ifc-api-iife.js → /hekatan-struct-lineal/web-ifc-api-iife.js -->
    <script src="../web-ifc-api-iife.js"></script>
  </head>
  <body>
    <!-- OJO: NO poner aqui un sello de version a mano (antes decia
         ?v=cursorfix29). Como ese texto no cambia al editar main.ts, el
         navegador se queda con el modulo cacheado PARA SIEMPRE: se edita el
         codigo, el servidor sirve lo nuevo, y en pantalla sigue lo viejo.
         Costo horas: el galpon no cargaba y salia Test M, con el arreglo ya
         hecho y funcionando en headless.
         Vite ya versiona los modulos por su cuenta en desarrollo, y en el
         build les pone hash en el nombre. No hace falta nada. -->
    <script type="module" src="./main.ts"></script>
    <script type="module" src="./franjasEntry.ts"></script>
  </body>
</html>
